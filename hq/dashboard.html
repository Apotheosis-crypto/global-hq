<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global HQ</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--ink:#e6ecf5;--dim:#8b98b0;--accent:#4c8dff;--hot:#ff5a5f;--warm:#ffb020;--ok:#3ccf91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:16px;letter-spacing:.14em;text-transform:uppercase;margin:0}h1 span{color:var(--accent)}
.clock{font:13px ui-monospace,monospace;color:var(--dim)}
main{display:grid;grid-template-columns:1fr 300px;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:14px;padding:4px 10px;cursor:pointer}
.filters button.on{color:var(--ink);border-color:var(--accent);background:#16264a}
.ev{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:52px 1fr;gap:12px}
.score{font:600 18px ui-monospace,monospace;text-align:center;border-radius:6px;padding:6px 0;height:fit-content}
.s-hot{background:#3a1418;color:var(--hot)}.s-warm{background:#3a2a0e;color:var(--warm)}.s-cool{background:#13233f;color:var(--accent)}
.ev h3{margin:0 0 4px;font-size:15px}.meta{color:var(--dim);font-size:12px}
.ev details{margin-top:6px}.ev summary{cursor:pointer;color:var(--dim);font-size:12px}
.ev ul{margin:6px 0 0;padding-left:18px}.ev a{color:var(--accent)}
.flash{display:inline-block;background:var(--hot);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:3px;margin-right:6px}
.src{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12px;border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:13px}
.empty{color:var(--dim);padding:20px 0}
</style>
</head>
<body>
<header>
  <h1>Global <span>Intelligence</span> HQ</h1>
  <div class="clock" id="clock"></div>
  <a class="btn" href="briefing/" target="_blank">Today's briefing</a>
</header>
<main>
  <section class="panel">
    <h2>Event watch (last 48h, verified sources)</h2>
    <div class="filters" id="filters"></div>
    <div id="events"><div class="empty">Waiting for first sweep...</div></div>
  </section>
  <aside>
    <div class="panel" style="margin-bottom:16px"><h2>Schedule</h2><div id="sched" class="meta"></div></div>
    <div class="panel"><h2>Source health</h2><div id="health"></div></div>
  </aside>
</main>
<script>
let events = [], region = "All", threshold = 70;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls = s => s >= 70 ? "s-hot" : s >= 45 ? "s-warm" : "s-cool";
function tick(){ const d=new Date(); document.getElementById("clock").textContent =
  ["UTC","America/New_York","Europe/London","Asia/Tokyo"].map(z=>z.split("/").pop().replace("_"," ")+" "+d.toLocaleTimeString("en-GB",{timeZone:z,hour:"2-digit",minute:"2-digit"})).join("  |  "); }
function render(){
  const regions = ["All", ...new Set(events.map(e => e.region))];
  document.getElementById("filters").innerHTML = regions.map(r => `<button class="${r===region?"on":""}" data-r="${esc(r)}">${esc(r)}</button>`).join("");
  const list = events.filter(e => region === "All" || e.region === region);
  document.getElementById("events").innerHTML = list.length ? list.map(e => `
    <div class="ev"><div class="score ${cls(e.score)}">${e.score}</div><div>
      <h3>${e.alerted ? '<span class="flash">FLASH</span>' : ""}${esc(e.headline)}</h3>
      <div class="meta">${esc(e.category)} · ${esc(e.region)} · ${e.sources} verified source(s)${e.tier1 ? " · official" : ""} · ${new Date(e.last_seen).toUTCString().slice(5,22)} UTC</div>
      <details><summary>Why this score / evidence</summary><ul>${e.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
      <ul>${e.evidence.map(i=>`<li><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.source_name)}</a>: ${esc(i.title)}</li>`).join("")}</ul></details>
    </div></div>`).join("") : '<div class="empty">No events yet.</div>';
}
document.getElementById("filters").addEventListener("click", e => { if (e.target.dataset.r) { region = e.target.dataset.r; render(); } });
async function load(){
  try {
    const d = await (await fetch("api/events.json")).json(); events = d.events; threshold = d.config.threshold;
    document.getElementById("sched").innerHTML = `Morning briefing: <b>${esc(d.config.briefing.time)}</b> ${esc(d.config.briefing.timezone)}<br>Flash alert threshold: score ≥ <b>${threshold}</b>`;
    render();
    const h = await (await fetch("api/health.json")).json();
    document.getElementById("health").innerHTML = h.map(s => `<div class="src"><span><span class="dot" style="background:${s.ok?"var(--ok)":"var(--hot)"}"></span>${esc(s.name)}</span><span class="meta">${s.tier ? "T"+s.tier : "scan"} · ${s.count}</span></div>`).join("");
  } catch (e) { console.error(e); }
}
tick(); setInterval(tick, 30000); load(); setInterval(load, 60000);
</script>
</body>
</html>
